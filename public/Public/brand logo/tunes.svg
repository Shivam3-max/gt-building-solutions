<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" role="img" aria-labelledby="title desc">
  <title id="title">Tunes logo</title>
  <desc id="desc">Web-referenced Tunes brand wordmark with a green e and gray lettering.</desc>
  <rect width="320" height="90" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="66">
    <text x="14" y="63" fill="#6b6f72" letter-spacing="-3">tun</text>
    <text x="132" y="63" fill="#8cc63e" letter-spacing="-3">e</text>
    <text x="168" y="63" fill="#6b6f72" letter-spacing="-3">s</text>
  </g>
  <text x="237" y="27" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b6f72">®</text>
</svg>
